<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxabxHsmwiDqQ8_voIf-4nzzaxSZ9oRE8S74WfO_ivtVLTOIRa9phL_jQYsAXPo5JBz/exec";
  const CACHE_KEY = "drive_materials_cache";
  const CACHE_TIME_KEY = "drive_materials_time";
  const CACHE_DURATION = 15 * 60 * 1000; // Cache for 15 minutes

  let cachedDriveData = null;

  // Pre-fetch data in background as soon as page loads
  document.addEventListener('DOMContentLoaded', () => {
    fetchDriveData(false);
  });

  async function fetchDriveData(forceRefresh = false) {
    if (!forceRefresh && cachedDriveData) {
      return cachedDriveData;
    }

    const localData = localStorage.getItem(CACHE_KEY);
    const localTime = localStorage.getItem(CACHE_TIME_KEY);

    // Use cached version if valid and not expired
    if (!forceRefresh && localData && localTime && (Date.now() - localTime < CACHE_DURATION)) {
      cachedDriveData = JSON.parse(localData);
      return cachedDriveData;
    }

    try {
      const response = await fetch(APPS_SCRIPT_URL);
      const data = await response.json();

      if (data) {
        cachedDriveData = data;
        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
        localStorage.setItem(CACHE_TIME_KEY, Date.now().toString());
      }
      return cachedDriveData;
    } catch (error) {
      if (localData) {
        return JSON.parse(localData); // Fallback to stale cache if network fails
      }
      throw error;
    }
  }

  async function filterMaterials() {
    const section = document.getElementById('sectionSelect').value.toLowerCase().trim();
    const course = document.getElementById('courseSelect').value.toLowerCase().trim();
    const container = document.getElementById('drive-directory-container');

    if (!section || !course) {
      container.innerHTML = '<p style="text-align:center; color:#c53030;">Please select both Section and Course.</p>';
      return;
    }

    container.innerHTML = '<p style="text-align:center; color:#666;">Searching folder contents...</p>';

    try {
      const rootFolder = await fetchDriveData();
      const matchedFolder = findMatchingFolder(rootFolder, section, course);

      if (!matchedFolder) {
        container.innerHTML = `<p style="text-align:center; color:#666;">No matching materials found for <strong>${section.toUpperCase()}</strong> and <strong>${course.toUpperCase()}</strong>.</p>`;
        return;
      }

      container.innerHTML = renderFolderTree(matchedFolder);
    } catch (error) {
      container.innerHTML = '<p style="text-align:center; color:#c53030;">Failed to load materials. Please try again.</p>';
    }
  }

  function findMatchingFolder(folder, section, course) {
    if (!folder || !folder.subfolders) return null;

    for (let sub of folder.subfolders) {
      const subName = sub.name.toLowerCase();

      if (subName.includes(section) && subName.includes(course)) {
        return sub;
      }

      if (subName.includes(section)) {
        const courseFolder = sub.subfolders.find(c => c.name.toLowerCase().includes(course));
        if (courseFolder) return courseFolder;
      }

      const deepMatch = findMatchingFolder(sub, section, course);
      if (deepMatch) return deepMatch;
    }

    return null;
  }

  function renderFolderTree(folder) {
    let html = `<ul style="list-style-type: none; padding-left: 0;">`;
    html += `<li style="margin-bottom: 10px; font-size: 16px;">📁 <a href="${folder.url}" target="_blank" rel="noopener noreferrer" style="font-weight: bold; color: #1a365d;">${folder.name}</a></li>`;

    if (folder.files && folder.files.length > 0) {
      html += `<ul style="list-style-type: none; padding-left: 20px; margin-bottom: 10px;">`;
      folder.files.forEach(file => {
        html += `<li style="margin-bottom: 6px;">📄 <a href="${file.url}" target="_blank" rel="noopener noreferrer">${file.name}</a></li>`;
      });
      html += `</ul>`;
    }

    if (folder.subfolders && folder.subfolders.length > 0) {
      folder.subfolders.forEach(subfolder => {
        html += renderFolderTree(subfolder);
      });
    }

    html += `</ul>`;
    return html;
  }
</script>
