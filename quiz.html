<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Student Quiz | ADUST</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --correct: #16a34a;
            --wrong: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        /* Fixed timer styling for top left corner */
        #timer-box {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--primary);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none;
            z-index: 1000;
        }

        .container {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--secondary);
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary);
        }

        .question-card {
            background: #f1f5f9;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--secondary);
        }

        .question-title {
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 12px;
        }

        .option-label {
            display: block;
            background: #ffffff;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .option-label:hover {
            border-color: var(--secondary);
            background: #eff6ff;
        }

        .option-label input {
            margin-right: 10px;
        }

        #quiz-box, #score-box, #loading-spinner {
            display: none;
        }

        .loader {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--secondary);
            margin: 20px 0;
        }

        .score-display {
            text-align: center;
            padding: 20px;
            background: #ecfdf5;
            border: 2px solid var(--correct);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .score-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--correct);
            margin-top: 10px;
        }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .summary-table th {
            background-color: var(--primary);
            color: #ffffff;
            padding: 10px 12px;
            text-align: left;
            font-size: 13px;
            border: 1px solid var(--primary);
        }

        .summary-table td {
            padding: 10px 12px;
            font-size: 13px;
            border: 1px solid var(--border);
            color: var(--text);
        }

        .review-card {
            background: #ffffff;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .review-option {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            border: 1px solid transparent;
            background: #f8fafc;
        }

        .option-correct {
            background-color: #dcfce7 !important;
            border-color: #16a34a !important;
            color: #166534;
            font-weight: 600;
        }

        .option-wrong {
            background-color: #fee2e2 !important;
            border-color: #dc2626 !important;
            color: #991b1b;
            text-decoration: line-through;
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--secondary);
            text-decoration: none;
            font-weight: 600;
        }

        .nav-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<!-- Floating Timer in Top Left Corner -->
<div id="timer-box">Time Left: <span id="time-display">03:30</span></div>

<div class="container">
    <a href="index.html" class="nav-back">&larr; Back to Main Site</a>
    <h1>Quiz Assessment</h1>

    <!-- STEP 1: Student Details & Subject Selection -->
    <div id="setup-box">
        <div class="form-group">
            <label for="student-name">Full Name:</label>
            <input type="text" id="student-name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="student-id">Student ID:</label>
            <input type="text" id="student-id" placeholder="Enter your student ID" required>
        </div>

        <div class="form-group">
            <label for="subject-select">Select Subject Course:</label>
            <select id="subject-select">
                <option value="TE_301_Day">TE 301 (Day)</option>
                <option value="TE_301_Evening">TE 301 (Evening)</option>
                <option value="CSE_210_Evening">CSE 210 (Evening)</option>
                <option value="TPHY_108_Evening">TPHY 108 (Evening)</option>
                <option value="TE_308_Evening">TE 308 (Evening)</option>
            </select>
        </div>

        <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- LOADING STATE -->
    <div id="loading-spinner" class="loader">
        Fetching questions and generating a quiz set...
    </div>

    <!-- STEP 2: Interactive Quiz View -->
    <div id="quiz-box">
        <form id="quiz-form">
            <div id="questions-container"></div>
            <button type="button" class="btn" onclick="submitQuiz()">Submit Answers</button>
        </form>
    </div>

    <!-- STEP 3: Results Display & Review -->
    <div id="score-box">
        <div class="score-display">
            <h2 style="color: var(--primary); margin-top: 0;">Submission Confirmation</h2>
            
            <div style="overflow-x: auto;">
                <table class="summary-table">
                    <thead>
                        <tr>
                            <th>Response Time</th>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Subject</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="res-time">-</td>
                            <td id="res-id">-</td>
                            <td id="res-name">-</td>
                            <td id="res-subject">-</td>
                            <td id="res-score" style="font-weight: bold; color: var(--correct);">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <p style="margin-bottom: 5px; font-weight: 600;">Your Final Score:</p>
            <div class="score-number" id="final-score">0 / 10</div>
        </div>

        <h3 style="color: var(--primary); margin-top: 30px;">Detailed Question Review</h3>
        <div id="review-container"></div>
    </div>
</div>

<script>
    const SPREADSHEET_ID = '1JLt7JzZ8B3AiEqXmuQqOxxzSCOKZsDzQHPg9vS2wlCM';
    const SCORE_ENDPOINT_URL = 'https://sheetdb.io/api/v1/e1pgxioa61cif';

    let selectedQuestions = [];
    let countdownInterval;
    let timeRemaining = 210; // 210 seconds total time limit

    // Helper: Parse raw CSV text into array of rows
    function parseCSV(text) {
        let lines = text.split('\n');
        return lines.map(line => {
            let values = [];
            let insideQuotes = false;
            let val = '';
            for (let c of line) {
                if (c === '"' && insideQuotes) {
                    insideQuotes = false;
                } else if (c === '"' && !insideQuotes) {
                    insideQuotes = true;
                } else if (c === ',' && !insideQuotes) {
                    values.push(val.trim().replace(/^"|"$/g, ''));
                    val = '';
                } else {
                    val += c;
                }
            }
            values.push(val.trim().replace(/^"|"$/g, ''));
            return values;
        });
    }

    // Fisher-Yates Random Shuffle
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    async function startQuiz() {
        const name = document.getElementById('student-name').value.trim();
        const id = document.getElementById('student-id').value.trim();
        const sheetTab = document.getElementById('subject-select').value;

        if (!name || !id) {
            alert("Please enter both your Name and Student ID.");
            return;
        }

        document.getElementById('setup-box').style.display = 'none';
        document.getElementById('loading-spinner').style.display = 'block';

        const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetTab}`;

        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            const rows = parseCSV(csvText);

            // Explicitly drop header row (row index 0)
            let dataRows = rows.slice(1);

            // Filter valid question rows (Must have question text + at least 2 valid options + correct answer)
            let validRows = dataRows.filter(row => {
                if (row.length < 7) return false;
                let qText = row[1] ? row[1].trim() : "";
                let correctAns = row[6] ? row[6].trim() : "";
                
                let optCount = 0;
                for (let c = 2; c <= 5; c++) {
                    let optVal = row[c] ? row[c].trim() : "";
                    if (optVal !== "" && optVal.toUpperCase() !== "N/A" && optVal !== "-") {
                        optCount++;
                    }
                }
                return qText !== "" && correctAns !== "" && optCount >= 2;
            });

            if (validRows.length === 0) {
                alert("No valid questions found in this sheet tab!");
                location.reload();
                return;
            }

            // Shuffle valid questions and pick 10
            let shuffled = shuffleArray(validRows);
            selectedQuestions = shuffled.slice(0, Math.min(10, shuffled.length));

            renderQuiz();

        } catch (error) {
            console.error(error);
            alert("Failed to load questions. Make sure your Google Sheet is published to the web!");
            location.reload();
        }
    }

    function renderQuiz() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        selectedQuestions.forEach((q, qIdx) => {
            let qText = q[1].trim();
            let rawOptions = [q[2], q[3], q[4], q[5]].filter(o => o && o.trim() !== "" && o.toUpperCase() !== "N/A" && o !== "-");
            let correctAnswer = q[6] ? q[6].trim() : "";

            // Shuffle options for each question
            let shuffledOptions = shuffleArray(rawOptions);

            let qCard = document.createElement('div');
            qCard.className = 'question-card';

            let qTitle = document.createElement('div');
            qTitle.className = 'question-title';
            qTitle.innerText = `${qIdx + 1}. ${qText}`;
            qCard.appendChild(qTitle);

            shuffledOptions.forEach(opt => {
                let label = document.createElement('label');
                label.className = 'option-label';
                
                let cleanOpt = opt.trim().toLowerCase();
                let cleanAns = correctAnswer.trim().toLowerCase();
                let isCorrect = (cleanAns === cleanOpt || cleanAns.endsWith(cleanOpt) || cleanAns.includes(cleanOpt));
                
                label.innerHTML = `
                    <input type="radio" name="q_${qIdx}" value="${opt.trim()}" data-correct="${isCorrect}">
                    ${opt.trim()}
                `;
                qCard.appendChild(label);
            });

            container.appendChild(qCard);
        });

        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('quiz-box').style.display = 'block';
        
        // Show and start the 210-second timer
        document.getElementById('timer-box').style.display = 'block';
        startTimer();
    }

    function startTimer() {
        const timeDisplay = document.getElementById('time-display');

        countdownInterval = setInterval(() => {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;

            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timeDisplay.textContent = `${minutes}:${seconds}`;

            if (timeRemaining <= 0) {
                clearInterval(countdownInterval);
                alert("Time is up! Your quiz is being submitted automatically.");
                submitQuiz();
            }
            timeRemaining--;
        }, 1000);
    }

    async function submitQuiz() {
        // Clear timer so it stops counting down if user manually clicks submit
        clearInterval(countdownInterval);
        document.getElementById('timer-box').style.display = 'none';

        let score = 0;
        let total = selectedQuestions.length;
        let reviewHTML = '';

        selectedQuestions.forEach((q, qIdx) => {
            let qText = q[1].trim();
            let rawOptions = [q[2], q[3], q[4], q[5]].filter(o => o && o.trim() !== "" && o.toUpperCase() !== "N/A" && o !== "-");
            let correctAnswer = q[6] ? q[6].trim().toLowerCase() : "";

            let selectedInput = document.querySelector(`input[name="q_${qIdx}"]:checked`);
            let studentVal = selectedInput ? selectedInput.value.trim().toLowerCase() : "";
            
            let isUserCorrect = false;

            reviewHTML += `<div class="review-card">
                <div class="question-title">${qIdx + 1}. ${qText}</div>`;

            rawOptions.forEach(opt => {
                let cleanOpt = opt.trim().toLowerCase();
                let isOptCorrect = (correctAnswer === cleanOpt || correctAnswer.endsWith(cleanOpt) || correctAnswer.includes(cleanOpt));
                let isSelected = (studentVal === cleanOpt);

                let optionClass = "";
                let indicator = "";

                if (isOptCorrect) {
                    optionClass = "option-correct";
                    indicator = " ✓ (Correct Answer)";
                } else if (isSelected && !isOptCorrect) {
                    optionClass = "option-wrong";
                    indicator = " ✗ (Your Answer)";
                }

                if (isSelected && isOptCorrect) {
                    isUserCorrect = true;
                }

                reviewHTML += `<div class="review-option ${optionClass}">${opt.trim()}${indicator}</div>`;
            });

            reviewHTML += `</div>`;

            if (isUserCorrect) {
                score++;
            }
        });

        const name = document.getElementById('student-name').value.trim();
        const id = document.getElementById('student-id').value.trim();
        const subjectSelect = document.getElementById('subject-select');
        const subjectText = subjectSelect.options[subjectSelect.selectedIndex].text;

        const now = new Date();
        const timeString = now.toISOString().slice(0, 19).replace('T', ' ');
        const scoreString = `${score} / ${total}`;

        // Populate summary table
        document.getElementById('res-time').innerText = timeString;
        document.getElementById('res-id').innerText = id;
        document.getElementById('res-name').innerText = name;
        document.getElementById('res-subject').innerText = subjectText;
        document.getElementById('res-score').innerText = scoreString;

        // Render detailed review container
        document.getElementById('review-container').innerHTML = reviewHTML;

        document.getElementById('quiz-box').style.display = 'none';
        document.getElementById('final-score').innerText = scoreString;
        document.getElementById('score-box').style.display = 'block';

        // Submit parameters to your SheetDB API endpoint
        if (SCORE_ENDPOINT_URL) {
            try {
                await fetch(SCORE_ENDPOINT_URL, {
                    method: "POST",
                    headers: { 
                        "Accept": "application/json",
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        data: {
                            "Response Time": timeString,
                            "ID": id,
                            "Name": name,
                            "Subject": subjectText,
                            "Score": scoreString
                        }
                    })
                });
            } catch (error) {
                console.error("Error submitting score to SheetDB:", error);
            }
        }
    }
</script>

</body>
</html>
